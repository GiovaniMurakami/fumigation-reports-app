version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -f package-lock.json ]; then npm ci; else npm install; fi
        - |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL não configurada no Amplify"
            exit 1
          fi
        - printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files: ['**/*']
  cache:
    paths: [node_modules/**/*]
